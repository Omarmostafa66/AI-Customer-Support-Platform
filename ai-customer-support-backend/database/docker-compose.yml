services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ntg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ntg_support
      POSTGRES_USER: ntg
      POSTGRES_PASSWORD: ntg_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: