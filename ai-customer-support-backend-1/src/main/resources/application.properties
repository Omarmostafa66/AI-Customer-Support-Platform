spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_customer_support_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Mora}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# =========================================================
# JWT Configuration
# =========================================================

app.jwt.secret=${JWT_SECRET:AI-Customer-Support-Super-Secret-Key-2026-Production}
app.jwt.expiration-ms=86400000

# =========================================================
# Default Admin Configuration
# =========================================================

app.admin.email=${ADMIN_EMAIL:admin@aicustomersupport.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123456}

# =========================================================
# Gemini AI Configuration
# =========================================================

gemini.api-key=${GEMINI_API_KEY:}

gemini.base-url=https://generativelanguage.googleapis.com/v1beta

gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.7-flash,gemini-3.5-flash}