<header class="customer-header">

  <!-- =====================================================
       Brand
  ====================================================== -->

  <a
    class="brand"
    routerLink="/customer/dashboard"
    aria-label="AI Customer Support home"
  >

    <span
      class="brand-icon"
      aria-hidden="true"
    >
      ✳
    </span>

    <span>
      AI Customer

      <span class="brand-second">
        Support
      </span>
    </span>

  </a>


  <!-- =====================================================
       Navigation
  ====================================================== -->

  <nav
    aria-label="Customer navigation"
  >

    <!-- AI Support -->

    <a
      routerLink="/customer/dashboard"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      AI Support
    </a>


    <!-- My Tickets -->

    <a
      routerLink="/customer/tickets"
      [class.active]="ticketsActive()"
      [attr.aria-current]="
        ticketsActive()
          ? 'page'
          : null
      "
    >
      My Tickets
    </a>


    <!-- My Account -->

    <a
      routerLink="/account"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      My Account
    </a>

  </nav>


  <!-- =====================================================
       Header Actions
  ====================================================== -->

  <div class="header-actions">

    <!-- Ask AI -->

    <a
      class="header-cta"
      routerLink="/customer/dashboard"
    >
      Ask AI

      <span
        aria-hidden="true"
      >
        ✦
      </span>

    </a>


    <!-- Profile -->

    <a
      class="customer-profile"
      routerLink="/account"
      aria-label="Open my account"
    >

      <span class="customer-profile-avatar">

        @if (avatarSource) {

          <img
            [src]="avatarSource"
            alt="Profile photo"
          />

        } @else {

          <span>
            {{ initials }}
          </span>

        }

      </span>

    </a>


    <!-- Logout -->

    <button
      type="button"
      class="logout-button"
      (click)="logout()"
    >
      Logout
    </button>

  </div>

</header>
